name: NEXUS Python module tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/nexus-evolution-2026-11]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python modules
        run: python -m py_compile nexus_wireless_engine.py nexus_bridge_termux.py nexus_plugin_manager.py
