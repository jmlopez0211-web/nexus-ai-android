name: NEXUS UltimateCore tests

on:
  push:
    branches: [feature/ultimatecore-engine]
    paths:
      - "modules/nexus_ultimate_core/**"
      - ".github/workflows/ultimate-core-tests.yml"
  pull_request:
    paths:
      - "modules/nexus_ultimate_core/**"
      - ".github/workflows/ultimate-core-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: modules/nexus_ultimate_core
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python files
        run: python -m compileall -q ultimate_core.py tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
